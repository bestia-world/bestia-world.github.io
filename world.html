</style></head><body><header><a class="brand" href="index.html">BESTIA <small>WORLD</small></a><nav><a href="index.html">HOME</a><a href="world.html" aria-current="page">NATIONS</a><a href="index.html#character">CHARACTERS</a></nav></header><div class="heading"><div class="eyebrow">ATLAS OF BESTIA</div><h1>The World Map</h1><p>세 국가가 자리한 베스티아의 세계.<br>지도 위 국가명을 누르거나 아래 목록에서 선택하세요.</p></div><main><div class="frame"><div class="map-scroll" tabindex="0" aria-label="베스티아 세계지도, 작은 화면에서는 좌우로 스크롤"><div class="map-stage"><img src="assets/bestia-map.png" alt="베스티아 세계지도. 북서쪽 레오니스 제국, 중앙 리베르타 공화국, 동쪽 금라국이 표시된 고풍스러운 판타지 지도"><button type="button" class="marker leonis" data-country="leonis" aria-pressed="false"><strong>레오니스 제국</strong><small>LEONIS EMPIRE</small></button><button type="button" class="marker liberta" data-country="liberta" aria-pressed="false"><strong>리베르타 공화국</strong><small>LIBERTA REPUBLIC</small></button><button type="button" class="marker geumra" data-country="geumra" aria-pressed="false"><strong>금라국</strong><small>GEUMRA</small></button></div></div></div><p class="hint">모바일에서는 지도를 좌우로 움직여 볼 수 있어요.</p><section class="details" id="countries"><h2>Explore the Nations</h2><div class="cards"><button class="country" data-country="leonis"><span>01 / WEST</span><strong>레오니스 제국</strong><small>LEONIS EMPIRE</small></button><button class="country" data-country="liberta"><span>02 / CENTER</span><strong>리베르타 공화국</strong><small>LIBERTA REPUBLIC</small></button><button class="country" data-country="geumra"><span>03 / EAST</span><strong>금라국</strong><small>GEUMRA</small></button></div><div class="panel" id="countryPanel" aria-live="polite"><h3>국가를 선택해 주세요</h3><p>국가별 상세 설정은 앞으로 이곳에 추가할 예정입니다.</p></div></section></main><footer class="foot">BESTIA WORLD · AN EXPANDING ORIGINAL UNIVERSE</footer><template id="leonis-template"><div class="nation-full"><h3 class="nation-heading">레오니스 제국</h3><div class="nation-subtitle">LEONIS EMPIRE · THE WESTERN EMPIRE</div><p>오랜 귀족의 전통과 새로운 산업의 시대가 공존하는 서방의 강대한 제국.</p><details class="l-accordion" open><summary>제국 개요<span aria-hidden="true">＋</span></summary><div class="l-content"><p>사자 황실이 통치하는 서방의 빅토리아풍 산업·귀족국가. 수도에는 웅장한 황궁과 귀족 저택, 석조 건축물이 늘어서고 가스등이 밝히는 대로를 따라 마차가 오간다. 증기기관차와 거대한 공장, 광산과 제철업이 발전하면서 전통적인 귀족 사회에도 변화가 찾아오고 있다.</p><p>황실 아래에는 늑대·곰·호랑이·뱀의 4대 공작가가 자리한다. 각 가문은 수도에 공작저를 두고 별도의 영지를 다스리며, 고유한 이해관계와 권력을 유지한다.</p><div class="facts"><div class="fact"><strong>통치와 계승</strong><p>정통 황실 혈통의 사자만 형질과 무관하게 황위를 계승한다. 황제는 ‘알파’, 배우자는 ‘루나’로 칭한다.</p></div><div class="fact"><strong>귀족의 호칭</strong><p>귀족의 배우자는 외형·형질과 관계없이 ‘파르’로 칭한다. 파르는 독립 작위가 아니며 공작부인·공작부군 등의 성별 호칭은 쓰지 않는다.</p></div><div class="fact"><strong>황실의 전통</strong><p>황실 혈통은 사자의 갈기를 상징하는 머리카락을 평생 자르지 않는다.</p></div><div class="fact"><strong>신분과 종족</strong><p>종족과 귀족 신분은 별개다. 가문의 법적 계승권이 우선하지만 황위 계승에는 정통 사자 혈통이라는 별도 조건이 적용된다.</p></div></div></div></details><details class="l-accordion" ><summary>사회와 문화<span aria-hidden="true">＋</span></summary><div class="l-content"><div class="facts"><div class="fact"><strong>귀족 사교계</strong><p>황실 무도회, 살롱, 티파티, 승마와 사냥 모임이 활발하다. 사교 시즌에는 귀족들이 수도에 모이고 혼인·후원·평판은 정치적 입지에도 영향을 미친다.</p></div><div class="fact"><strong>산업과 도시</strong><p>증기기관과 철도, 광산과 제철업, 금융과 국제무역이 발전했다. 화려한 귀족 거리와 공장지대, 노동자 거주지가 공존한다.</p></div><div class="fact"><strong>권력의 균형</strong><p>황실과 4대 공작가는 협력하면서도 서로 견제한다. 공작가들은 각자의 영지와 경제·군사 기반을 통해 제국의 정치에 영향력을 행사한다.</p></div><div class="fact"><strong>변화하는 시대</strong><p>황족·귀족·평민의 신분 질서 속에서 신흥 자본가가 부상한다. 오래된 혈통과 새로운 부의 가치가 충돌한다.</p></div></div></div></details><details class="l-accordion" ><summary>레오니스 황실<span aria-hidden="true">＋</span></summary><div class="l-content"><p>정통 황족 중 사자만 황위를 계승한다. 솔·테라의 구분은 황위 계승 조건이 아니다.</p><div class="people"><div class="person"><h4>쟈크 레오니스 · 현 알파</h4><p>48세 · 사자 · 솔. 금발 장발과 호박색 눈. 위엄 있고 온화하지만 냉철한 정치가.</p></div><div class="person"><h4>라비엔 세르카 · 현 루나</h4><p>붉은여우 · 남성형 테라. 붉은 머리와 녹색 눈. 영리하고 능글맞으며 사교와 정치에 능하다.</p></div></div></div></details><details class="l-accordion"><summary>4대 공작가와 주요 인물<span aria-hidden="true">＋</span></summary><div class="l-content leonis-collection"><article class="leonis-house"><div class="leonis-house-head"><span class="tag">호랑이 · 무력과 명예</span><h3>티그란트 공작가</h3><div class="en">HOUSE TIGRANT</div><p>무력과 무예, 명예를 중시하는 호랑이 가문. 황실에 충성하되 부당한 간섭을 거부하며, 수도 공작저와 별도의 영지를 유지한다.</p></div><div class="leonis-profile"><img src="assets/aaron.webp" alt="애런 티그란트 캐릭터 공식 일러스트" loading="lazy"><div class="leonis-profile-copy"><div class="leonis-person-en">AARON TIGRANT</div><h4>애런 티그란트</h4><p class="leonis-meta">36세 · 200cm · 흑호 · 남성형 솔 · 티그란트 공작</p><h5>외모</h5><p>흑발과 황금빛 눈, 사나운 인상과 거대한 근육질 체격. 과묵하고 냉정하지만 책임감이 강하고 타인의 기분을 세심히 살핀다. 뛰어난 무력과 판단력을 갖춘 유능한 공작이다.</p><h5>성격과 배경</h5><p>3년 전 배우자 엘로디를 출산 중 잃고 외아들 리비를 홀로 키워왔다. 황실의 정치적 이해관계로 새로운 정략혼을 맺었으며, 사별한 배우자의 추억을 소중히 간직한다.</p><h5>관련 인물</h5><p>리비 티그란트 · 3세 · 흰 토끼 · 여성형 솔. 애런의 외아들이자 티그란트 공자. 밝고 호기심이 많으며 드레스와 리본을 좋아한다. 엘로디 벨리에 · 토끼·테라. 애런의 첫 배우자이자 리비의 생모로, 리비 출산 중 사망했다.</p><a class="play-link" href="https://www.whif.io/characters/c0a9ad1b-a622-4354-9f70-ce1988db4fc8" target="_blank" rel="noopener noreferrer">위프에서 애런 플레이하기 ↗</a></div></div></article><article class="leonis-house"><div class="leonis-house-head"><span class="tag">늑대 · 충성심과 결속</span><h3>루프가르드 공작가</h3><div class="en">HOUSE LUPGARD</div><p>군사 지휘와 조직력에 뛰어난 늑대 가문. 높은 충성심과 결속력으로 유명하며, 대대로 사교적이고 고결한 명문가로 제국의 군사적 안정을 뒷받침한다.</p></div><div class="leonis-profile"><img src="assets/raphael.webp" alt="라파엘 루프가르드 캐릭터 공식 일러스트" loading="lazy"><div class="leonis-profile-copy"><div class="leonis-person-en">RAPHAEL LUPGARD</div><h4>라파엘 루프가르드</h4><p class="leonis-meta">40세 · 193cm · 늑대 · 남성형 솔 · 루프가르드 공작</p><h5>외모</h5><p>짙은 회갈색 중장발과 은회색 눈, 날카롭고 성숙한 얼굴. 넓은 어깨와 탄탄한 체격을 지녔다. 완전 변신 시 거대한 회갈색 늑대가 된다.</p><h5>성격과 배경</h5><p>능청스럽고 여유로운 독신주의자. 재치 있는 농담과 유혹을 즐기지만 결혼과 헌신에는 거리를 둔다. 영지 운영과 정치, 사교계 인맥 관리에 능하며 공적인 자리에서는 냉철하게 책임을 다한다.</p><a class="play-link" href="https://www.whif.io/characters/f35ac327-ea70-4908-9784-11144944503e" target="_blank" rel="noopener noreferrer">위프에서 라파엘 플레이하기 ↗</a></div></div></article><article class="leonis-house"><div class="leonis-house-head"><span class="tag">곰 · 광산과 군수 산업</span><h3>그라벤하르트 공작가</h3><div class="en">HOUSE GRAVENHARDT</div><p>광대한 영지와 광산, 제철업을 기반으로 막대한 부를 축적한 곰 가문. 군수 산업과 국경 방위를 담당하며 엄격한 위계와 실력주의를 중시한다.</p></div><div class="leonis-profile"><img src="assets/victor.webp" alt="빅터 그라벤하르트 캐릭터 공식 일러스트" loading="lazy"><div class="leonis-profile-copy"><div class="leonis-person-en">VICTOR GRAVENHARDT</div><h4>빅터 그라벤하르트</h4><p class="leonis-meta">35세 · 193cm · 흑곰 · 남성형 솔 · 그라벤하르트 공작</p><h5>외모</h5><p>짙은 흑발과 붉은 눈, 위압적인 눈매와 육중한 근육질 체격. 전장에서 얻은 크고 작은 흉터가 남아 있다.</p><h5>성격과 배경</h5><p>제국의 군사적 실권을 쥔 강경한 공작. 수많은 전장에서 잔혹한 통솔력과 무력으로 악명을 쌓았다. 오만하고 지배욕이 강하며 불복종을 용납하지 않는다. 자신의 소유라고 여기는 존재에게 집착하고 통제하려 한다.</p><a class="play-link" href="https://www.whif.io/characters/436d7eef-2d4e-4df2-90c6-3b6f2bfc8872" target="_blank" rel="noopener noreferrer">위프에서 빅터 플레이하기 ↗</a></div></div></article><article class="leonis-house"><div class="leonis-house-head"><span class="tag">뱀 · 외교와 금융</span><h3>비타일 공작가</h3><div class="en">HOUSE VITAIL</div><p>외교·정보·정치·금융에 뛰어난 뱀 가문. 비타일 상회를 비롯한 국제 거래망과 정보망을 통해 귀족 사회와 상업계 모두에 영향력을 행사한다.</p></div><div class="leonis-profile"><img src="assets/allen.webp" alt="알렌 비타일 캐릭터 공식 일러스트" loading="lazy"><div class="leonis-profile-copy"><div class="leonis-person-en">ALLEN VITAIL</div><h4>알렌 비타일</h4><p class="leonis-meta">29세 · 188cm · 알비노 보아 · 남성형 솔 · 비타일 공작</p><h5>외모</h5><p>허리까지 흐르는 긴 백발, 황금빛 세로 동공과 창백한 피부. 아름답고 날카로운 인상과 길고 탄탄한 체격. 본래 모습은 거대한 백색 보아다.</p><h5>성격과 배경</h5><p>비타일 상회 대표. 우아하고 능글맞지만 교활하고 냉혹한 계산가. 타인의 약점과 욕망을 이용하며 원하는 것을 얻기 위해 상황을 조종한다. 자신의 사랑과 소유욕을 구분하지 못한다.</p><h5>작품 배경</h5><p>작품 배경에서는 첫눈에 반한 상대와 약혼하기 위해 상대 가문의 위기를 조장하고 기존 혼담을 파기시킨 뒤, 구원자처럼 나타나 약혼을 성사시켰다.</p><a class="play-link" href="https://www.whif.io/characters/4a49fef4-2293-4fbc-90e6-3ff42531a044" target="_blank" rel="noopener noreferrer">위프에서 알렌 플레이하기 ↗</a></div></div></article></div></details></div></template><template id="liberta-template"><div class="nation-full"><h3 class="nation-heading">리베르타 공화국</h3><div class="nation-subtitle">LIBERTA REPUBLIC · THE MARITIME REPUBLIC</div><p>자유와 평등을 내세우지만, 부와 영향력이 실질적인 권력을 결정하는 해상무역 공화국.</p>
<details class="l-accordion" open><summary>국가 개요<span aria-hidden="true">＋</span></summary><div class="l-content"><p>지중해풍 해상무역 공화국. 시민이 선출한 의회와 집정관이 통치하며, 국적·종족·출신보다 자본과 실력이 사회적 지위를 좌우한다. 그러나 실권은 거대 상단과 유력 가문이 쥐고 있다.</p><div class="facts"><div class="fact"><strong>정치 체제</strong><p>시민이 선출하는 의회와 집정관이 통치한다. 상단과 금융가들의 자금력이 정책과 권력에 큰 영향을 미친다.</p></div><div class="fact"><strong>경제</strong><p>해상무역·항만·금융·상업이 발달했다. 세계 각지의 상선과 여행자들이 항구를 오간다.</p></div><div class="fact"><strong>사회</strong><p>다양한 종족과 출신이 공존하는 개방적인 사회지만, 극심한 빈부 격차가 존재한다.</p></div><div class="fact"><strong>법과 치안</strong><p>법과 치안은 존재하지만 부와 영향력에 따라 집행이 달라진다. 권력층과 범죄조직의 유착도 만연하다.</p></div></div></div></details>
<details class="l-accordion"><summary>도시와 문화<span aria-hidden="true">＋</span></summary><div class="l-content"><p>따뜻한 해안을 따라 흰 석조 건물과 붉은 기와지붕, 아치형 회랑과 광장이 이어진다. 항구와 시장, 운하를 중심으로 상업이 발달했으며, 선술집과 거리 공연, 축제와 가면무도회가 도시를 활기차게 만든다.</p><p>화려한 상업지구와 부유한 상인의 저택 뒤편에는 빈민가와 밀수 창고, 불법 거래가 이루어지는 뒷골목이 공존한다. 사교 모임은 오락인 동시에 정치적 협상과 은밀한 거래의 장이 되기도 한다.</p></div></details>
<details class="l-accordion"><summary>지하세계와 대경매장<span aria-hidden="true">＋</span></summary><div class="l-content"><p>밀수·암시장·해적·청부업·정보 거래가 성행하며 합법 기업과 지하 조직이 복잡하게 얽혀 있다. 일부 범죄조직은 상단이나 운송업체 등의 합법 사업을 통해 활동한다.</p><div class="fact"><strong>대경매장</strong><p>리베르타 공화국의 거대한 지하 경매장. 도난품·금지 유물·기밀정보·희귀 혈통의 수인 등 온갖 불법 거래가 이루어지며 인신매매까지 자행된다. 막대한 자금과 정치적 비호로 치안 당국도 쉽게 개입하지 못한다.</p><p><strong>소유주 · 체이스 발렌틴</strong> — 뒷조직 ‘크로우’의 보스이자 발렌틴 상회 대표. 대경매장을 소유·운영하며 리베르타의 암시장에 막대한 영향력을 행사한다.</p></div></div></details>
<details class="l-accordion"><summary>주요 인물과 해상 세력<span aria-hidden="true">＋</span></summary><div class="l-content"><div class="liberta-profile"><img src="assets/kyles.jpg" alt="불타는 배를 배경으로 피 묻은 칼을 어깨에 걸친 카일스의 표지 일러스트" loading="lazy"><div><h4>카일스 · KYLES</h4><p class="meta">40세 · 범고래 종족 · 남성형 솔 · 블랙 리바이어던 선장</p><p>거대한 흑색 해적선 ‘블랙 리바이어던’을 이끄는 악명 높은 해적 선장. 리베르타를 비롯한 여러 국가의 상선과 군함을 습격해 왔으며, 각국 해군의 현상수배 명단에 올라 있다. 특정 국가에 소속되지 않는다.</p><p>짧게 넘긴 흑발과 날렵한 눈매, 눈가의 흰 무늬, 금귀걸이와 오래된 흉터가 특징이다. 젊고 아름다운 얼굴과 달리 거대한 근육질 체격을 지녔다.</p><p>거칠고 호탕하며 짓궂고 뻔뻔하다. 부하들과 농담을 주고받으며, 풍부한 항해·전투 경험과 빠른 판단력으로 선원들의 신뢰를 얻는다. 원하는 것을 향한 욕심에는 거침이 없다.</p><a class="play-link" href="https://www.whif.io/characters/3a06f716-8f61-47ef-96cc-0e6ac858e1c7" target="_blank" rel="noopener noreferrer">위프에서 카일스 플레이하기 ↗</a></div></div><div class="liberta-profile"><img src="assets/chase.png" alt="검은 깃털 장식의 코트와 보랏빛 보석을 착용한 체이스 발렌틴의 표지 일러스트" loading="lazy"><div><h4>체이스 발렌틴 · CHASE VALENTIN</h4><p class="meta">37세 · 까마귀 수인 · 남성형 솔 · 크로우 보스 · 대경매장 운영자 · 발렌틴 상회 대표</p><p><strong>망치가 세 번 울리면, 누군가의 운명이 그의 장부에 적힌다.</strong></p><p>리베르타 공화국의 뒷조직 ‘크로우’를 이끄는 보스이자 대경매장 운영자. 발렌틴 상회를 통해 쌓은 부와 거래망을 바탕으로 귀족과 상인, 뒷세계의 인물들을 상대한다. 값비싼 보석부터 살아 있는 수인까지 거래되는 경매장에서 무엇이든 가격을 매기고 원하는 것을 손에 넣는다.</p><p><strong>외모</strong> — 뒤로 넘긴 흑발과 보라색 눈동자, 나른하면서도 날카로운 눈매. 창백한 피부와 선명한 이목구비, 넓은 어깨와 길고 단련된 체격. 검은 롱코트와 자수정 장신구를 즐겨 착용한다.</p><p><strong>성격</strong> — 오만하고 냉혹하며 자신의 체면과 결정권에 광적으로 집착한다. 평소에는 나른한 웃음과 건조한 반말로 상대를 다루지만, 공개적으로 모욕당하면 손해를 알면서도 거래를 엎는다. 흥미로운 상대를 통제하기를 즐기며, 흥미가 식으면 냉정하게 버릴 수 있다.</p><div class="fact"><strong>크로우 · CROW</strong><p>체이스 발렌틴을 정점으로 경매와 항만 운송, 정보 거래를 수행하는 뒷조직. 발렌틴 상회와 대경매장을 중심으로 움직이며 귀족 고객, 상단, 부패한 관리들과 이해관계로 얽혀 있다.</p></div><a class="play-link" href="https://www.whif.io/characters/7a9c59db-f336-455e-bcad-d2d306ef7dfc" target="_blank" rel="noopener noreferrer">위프에서 체이스 플레이하기 ↗</a></div></div></div></details></div></template><script>
const info={liberta:['리베르타 공화국','평야와 숲, 항구 무역도시가 발달한 공화국. 상세 설정은 추후 등록됩니다.'],geumra:['금라국','동방에 자리한 국가. 역사와 문화, 소속 인물은 추후 등록됩니다.']};
const controls=[...document.querySelectorAll('[data-country]')];
const panel=document.getElementById('countryPanel');
const leonisTemplate=document.getElementById('leonis-template');
const libertaTemplate=document.getElementById('liberta-template');
controls.forEach(btn=>btn.addEventListener('click',()=>{
 const key=btn.dataset.country;
 controls.forEach(b=>{const selected=b.dataset.country===key;b.classList.toggle('active',selected);if(b.classList.contains('marker'))b.setAttribute('aria-pressed',String(selected));});
 panel.replaceChildren();
 if(key==='leonis') panel.append(leonisTemplate.content.cloneNode(true));
 else if(key==='liberta') panel.append(libertaTemplate.content.cloneNode(true));
 else {const h=document.createElement('h3');h.textContent=info[key][0];const p=document.createElement('p');p.textContent=info[key][1];panel.append(h,p);}
 if(matchMedia('(max-width:700px)').matches)panel.scrollIntoView({behavior:'smooth',block:'start'});
}));
</script><button id="backToTop" type="button" aria-label="맨 위로 이동" title="맨 위로">↑</button>
<script>
(()=>{const button=document.getElementById('backToTop');const update=()=>button.classList.toggle('visible',window.scrollY>420);window.addEventListener('scroll',update,{passive:true});update();button.addEventListener('click',()=>window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}));})();
</script></body></html>
