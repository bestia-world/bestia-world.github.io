const info={leonis:['레오니스 제국','서방에 자리한 제국. 국가의 역사와 문화, 소속 인물은 추후 등록됩니다.'],liberta:['리베르타 공화국','평야와 숲, 항구 무역도시가 발달한 공화국. 상세 설정은 추후 등록됩니다.'],geumra:['금라국','동방에 자리한 국가. 역사와 문화, 소속 인물은 추후 등록됩니다.']};const controls=[...document.querySelectorAll('[data-country]')];const panel=document.getElementById('countryPanel');controls.forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.country;controls.forEach(b=>{b.classList.toggle('active',b.dataset.country===key);if(b.classList.contains('marker'))b.setAttribute('aria-pressed',String(b.dataset.country===key))});panel.replaceChildren();const h=document.createElement('h3');h.textContent=info[key][0];const p=document.createElement('p');p.textContent=info[key][1];panel.append(h,p);if(matchMedia('(max-width:700px)').matches)panel.scrollIntoView({behavior:'smooth',block:'nearest'});}));
</script></body></html>
