</style></head><body><header><a class="brand" href="index.html">BESTIA <small>WORLD</small></a><nav><a href="index.html">HOME</a><a href="world.html" aria-current="page">NATIONS</a><a href="index.html#character">CHARACTERS</a></nav></header><div class="heading"><div class="eyebrow">ATLAS OF BESTIA</div><h1>The World Map</h1><p>세 국가가 자리한 베스티아의 세계.<br>지도 위 국가명을 누르거나 아래 목록에서 선택하세요.</p></div><main><div class="frame"><div class="map-scroll" tabindex="0" aria-label="베스티아 세계지도, 작은 화면에서는 좌우로 스크롤"><div class="map-stage"><img src="assets/bestia-map.png" alt="베스티아 세계지도. 북서쪽 레오니스 제국, 중앙 리베르타 공화국, 동쪽 금라국이 표시된 고풍스러운 판타지 지도"><button type="button" class="marker leonis" data-country="leonis" aria-pressed="false"><strong>레오니스 제국</strong><small>LEONIS EMPIRE</small></button><button type="button" class="marker liberta" data-country="liberta" aria-pressed="false"><strong>리베르타 공화국</strong><small>LIBERTA REPUBLIC</small></button><button type="button" class="marker geumra" data-country="geumra" aria-pressed="false"><strong>금라국</strong><small>GEUMRA</small></button></div></div></div><p class="hint">모바일에서는 지도를 좌우로 움직여 볼 수 있어요.</p><section class="details" id="countries"><h2>Explore the Nations</h2><div class="cards"><button class="country" data-country="leonis"><span>01 / WEST</span><strong>레오니스 제국</strong><small>LEONIS EMPIRE</small></button><button class="country" data-country="liberta"><span>02 / CENTER</span><strong>리베르타 공화국</strong><small>LIBERTA REPUBLIC</small></button><button class="country" data-country="geumra"><span>03 / EAST</span><strong>금라국</strong><small>GEUMRA</small></button></div><div class="panel" id="countryPanel" aria-live="polite"><h3>국가를 선택해 주세요</h3><p>국가별 상세 설정은 앞으로 이곳에 추가할 예정입니다.</p></div></section></main><footer class="foot">BESTIA WORLD · AN EXPANDING ORIGINAL UNIVERSE</footer><template id="leonis-template"><div class="nation-full"><h3 class="nation-heading">레오니스 제국</h3><div class="nation-subtitle">LEONIS EMPIRE · THE WESTERN EMPIRE</div><p>오랜 귀족의 전통과 새로운 산업의 시대가 공존하는 서방의 강대한 제국.</p><details class="l-accordion" open><summary>제국 개요<span aria-hidden="true">＋</span></summary><div class="l-content"><p>사자 황실이 통치하는 서방의 빅토리아풍 산업·귀족국가. 수도에는 웅장한 황궁과 귀족 저택, 석조 건축물이 늘어서고 가스등이 밝히는 대로를 따라 마차가 오간다. 증기기관차와 거대한 공장, 광산과 제철업이 발전하면서 전통적인 귀족 사회에도 변화가 찾아오고 있다.</p><p>황실 아래에는 늑대·곰·호랑이·뱀의 4대 공작가가 자리한다. 각 가문은 수도에 공작저를 두고 별도의 영지를 다스리며, 고유한 이해관계와 권력을 유지한다.</p><div class="facts"><div class="fact"><strong>통치와 계승</strong><p>정통 황실 혈통의 사자만 형질과 무관하게 황위를 계승한다. 황제는 ‘알파’, 배우자는 ‘루나’로 칭한다.</p></div><div class="fact"><strong>귀족의 호칭</strong><p>귀족의 배우자는 외형·형질과 관계없이 ‘파르’로 칭한다. 파르는 독립 작위가 아니며 공작부인·공작부군 등의 성별 호칭은 쓰지 않는다.</p></div><div class="fact"><strong>황실의 전통</strong><p>황실 혈통은 사자의 갈기를 상징하는 머리카락을 평생 자르지 않는다.</p></div><div class="fact"><strong>신분과 종족</strong><p>종족과 귀족 신분은 별개다. 가문의 법적 계승권이 우선하지만 황위 계승에는 정통 사자 혈통이라는 별도 조건이 적용된다.</p></div></div></div></details><details class="l-accordion" ><summary>사회와 문화<span aria-hidden="true">＋</span></summary><div class="l-content"><div class="facts"><div class="fact"><strong>귀족 사교계</strong><p>황실 무도회, 살롱, 티파티, 승마와 사냥 모임이 활발하다. 사교 시즌에는 귀족들이 수도에 모이고 혼인·후원·평판은 정치적 입지에도 영향을 미친다.</p></div><div class="fact"><strong>산업과 도시</strong><p>증기기관과 철도, 광산과 제철업, 금융과 국제무역이 발전했다. 화려한 귀족 거리와 공장지대, 노동자 거주지가 공존한다.</p></div><div class="fact"><strong>권력의 균형</strong><p>황실과 4대 공작가는 협력하면서도 서로 견제한다. 공작가들은 각자의 영지와 경제·군사 기반을 통해 제국의 정치에 영향력을 행사한다.</p></div><div class="fact"><strong>변화하는 시대</strong><p>황족·귀족·평민의 신분 질서 속에서 신흥 자본가가 부상한다. 오래된 혈통과 새로운 부의 가치가 충돌한다.</p></div></div></div></details><details class="l-accordion" ><summary>레오니스 황실<span aria-hidden="true">＋</span></summary><div class="l-content"><p>정통 황족 중 사자만 황위를 계승한다. 솔·테라의 구분은 황위 계승 조건이 아니다.</p><div class="people"><div class="person"><h4>쟈크 레오니스 · 현 알파</h4><p>48세 · 사자 · 솔. 금발 장발과 호박색 눈. 위엄 있고 온화하지만 냉철한 정치가.</p></div><div class="person"><h4>라비엔 세르카 · 현 루나</h4><p>붉은여우 · 남성형 테라. 붉은 머리와 녹색 눈. 영리하고 능글맞으며 사교와 정치에 능하다.</p></div></div></div></details><details class="l-accordion" ><summary>4대 공작가<span aria-hidden="true">＋</span></summary><div class="l-content"><div class="house-grid"><article class="house"><span class="tag">호랑이 · 무력과 명예</span><h3>티그란트 공작가</h3><div class="en">TIGRANT</div><p>무력·무예·명예를 중시하며 독립성과 자존심이 강하다. 황실에 충성하지만 부당한 간섭은 거부한다.</p><div class="people"><div class="person"><h4>애런 티그란트</h4><p>현 공작 · 36세 · 호랑이. 흑발·금안, 200cm. 사나운 인상과 과묵한 성격.</p></div><div class="person"><h4>리비 티그란트</h4><p>외아들 · 3세 · 토끼·솔. 백발·분홍색 눈의 여성형 공자. 드레스와 리본을 즐겨 입는다.</p></div></div></article><article class="house"><span class="tag">늑대 · 충성심과 결속</span><h3>루프가르드 공작가</h3><div class="en">LUPGARD</div><p>군사 지휘와 조직력에 뛰어나며 높은 충성심과 결속력으로 유명하다. 대대로 사교적이고 고결한 명문가로 제국의 군사적 안정을 뒷받침한다.</p><div class="person"><h4>라파엘 루프가르드</h4><p>현 공작 · 40대. 짙은 회갈색 올백 머리와 은회색 눈. 귀족적이고 퇴폐적인 분위기, 능청스럽고 여유로운 태도.</p></div></article><article class="house"><span class="tag">곰 · 광산과 군수 산업</span><h3>그라벤하르트 공작가</h3><div class="en">GRAVENHART</div><p>광대한 영지와 광산·제철업을 바탕으로 막대한 부를 축적했다. 군수 산업과 국경 방위를 담당하며 엄격한 위계와 실력주의를 중시한다.</p><div class="person"><h4>빅터 그라벤하르트</h4><p>현 공작 · 35세 · 흑곰·솔. 193cm, 짙은 회갈색 머리와 붉은 눈. 오만하고 잔혹하며 무능과 불복종을 용납하지 않는다.</p></div></article><article class="house"><span class="tag">뱀 · 외교와 금융</span><h3>비타일 공작가</h3><div class="en">VITAIL</div><p>외교·정보·정치·금융에 뛰어난 명문가. 각국의 상회와 정보망을 통해 국제무역과 자본에 영향력을 행사한다.</p><div class="person"><h4>알렌 비타일</h4><p>현 공작 · 29세 · 알비노 보아·솔. 비타일 상회 운영. 긴 백발, 황금빛 세로 동공과 창백한 피부. 우아하고 능글맞지만 교활하고 계산적이다.</p></div></article></div></div></details></div></template><script>
const info={liberta:['리베르타 공화국','평야와 숲, 항구 무역도시가 발달한 공화국. 상세 설정은 추후 등록됩니다.'],geumra:['금라국','동방에 자리한 국가. 역사와 문화, 소속 인물은 추후 등록됩니다.']};
const controls=[...document.querySelectorAll('[data-country]')];
const panel=document.getElementById('countryPanel');
const leonisTemplate=document.getElementById('leonis-template');
controls.forEach(btn=>btn.addEventListener('click',()=>{
 const key=btn.dataset.country;
 controls.forEach(b=>{const selected=b.dataset.country===key;b.classList.toggle('active',selected);if(b.classList.contains('marker'))b.setAttribute('aria-pressed',String(selected));});
 panel.replaceChildren();
 if(key==='leonis') panel.append(leonisTemplate.content.cloneNode(true));
 else {const h=document.createElement('h3');h.textContent=info[key][0];const p=document.createElement('p');p.textContent=info[key][1];panel.append(h,p);}
 if(matchMedia('(max-width:700px)').matches)panel.scrollIntoView({behavior:'smooth',block:'start'});
}));
</script></body></html>
